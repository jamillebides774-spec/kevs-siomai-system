<!-- 
  ==============================================================================
  INVENTORY VIEW COMPONENT (HTML + CSS + JS)
  ==============================================================================
  Self-contained HTML component: includes markup, <style>, and <script>.
-->

<div id="inventory-view-component" class="inventory-page">
  <!-- Header -->
  <div class="inv-header-row">
    <div>
      <h1 class="inv-title">Inventory</h1>
    </div>
    <div class="inv-btn-group">
      <button class="btn btn-primary" onclick="openAddProductModal()">Add Product</button>
      <button class="btn btn-secondary" onclick="loadInventoryData()">Refresh</button>
    </div>
  </div>

  <!-- Summary KPI Cards -->
  <div class="inv-stats-grid">
    <div class="inv-stat-card">
      <div>
        <div class="inv-stat-label">TOTAL PRODUCTS</div>
        <div class="inv-stat-value" id="inv-total-count">0</div>
      </div>
    </div>

    <div class="inv-stat-card">
      <div>
        <div class="inv-stat-label">ACTIVE FOR SALE</div>
        <div class="inv-stat-value text-green" id="inv-active-count">0</div>
      </div>
    </div>

    <div class="inv-stat-card">
      <div>
        <div class="inv-stat-label">DISABLED / HIDDEN</div>
        <div class="inv-stat-value text-red" id="inv-disabled-count">0</div>
      </div>
    </div>

    <div class="inv-stat-card">
      <div>
        <div class="inv-stat-label">LOW STOCK ITEMS</div>
        <div class="inv-stat-value" id="inv-low-count">0</div>
      </div>
    </div>
  </div>

  <!-- Category Filter Bar (Queue section design) -->
  <div class="inv-filter-bar">
    <div class="tab-bar" id="inv-html-tabs">
      <button class="tab-btn active" data-cat="All" onclick="setInvCategory('All')">
        All <span class="tab-count" id="count-all">0</span>
      </button>
      <button class="tab-btn" data-cat="Hotspot Siomai" onclick="setInvCategory('Hotspot Siomai')">
        Hotspot Siomai <span class="tab-count" id="count-siomai">0</span>
      </button>
      <button class="tab-btn" data-cat="Drinks" onclick="setInvCategory('Drinks')">
        Drinks <span class="tab-count" id="count-drinks">0</span>
      </button>
      <button class="tab-btn" data-cat="Add-ons" onclick="setInvCategory('Add-ons')">
        Add-ons <span class="tab-count" id="count-addons">0</span>
      </button>
    </div>
  </div>

  <!-- Product Table Card -->
  <div class="inv-table-card">
    <div class="table-scroller">
      <table class="inv-table">
        <thead>
          <tr>
            <th>Item Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock Level</th>
            <th>Customer Status</th>
            <th style="text-align: center;">Enable / Disable</th>
            <th style="text-align: center;">Quick Refill</th>
          </tr>
        </thead>
        <tbody id="inv-table-body">
          <tr>
            <td colspan="7" style="text-align: center; padding: 32px; color: #94a3b8;">
              Loading inventory catalog...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<style>
  .inventory-page {
    font-family: 'Inter', system-ui, sans-serif;
    color: #f1f5f9;
    display: flex;

<style>
  .inventory-page {
    font-family: 'Inter', system-ui, sans-serif;
    color: #f1f5f9;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .inv-header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .inv-title { font-size: 24px; font-weight: 800; color: #fff; margin: 0; }
  .inv-subtitle { font-size: 14px; color: #94a3b8; margin-top: 2px; }
  .inv-btn-group { display: flex; align-items: center; gap: 10px; }

  .inv-stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }
  .inv-stat-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 10px 20px -5px rgba(0,0,0,0.3);
  }
  .inv-stat-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .inv-stat-label { font-size: 11px; font-weight: 700; color: #94a3b8; }
  .inv-stat-value { font-size: 28px; font-weight: 800; color: #ffffff; line-height: 1.2; margin-top: 2px; }
  .inv-stat-sub   { font-size: 11px; margin-top: 2px; color: #94a3b8; }

  .inv-table-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 10px 20px -5px rgba(0,0,0,0.3);
    overflow: hidden;
  }
  .table-scroller { overflow-x: auto; }
  .inv-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-size: 14px;
  }
  .inv-table th {
    padding: 12px 16px;
    border-bottom: 1px solid #334155;
    color: #94a3b8;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .inv-table td {
    padding: 14px 16px;
    border-bottom: 1px solid #334155;
  }
  .inv-item-name { font-weight: 700; color: #ffffff; }
  .inv-item-price { font-weight: 800; color: #34d399; }
  .stock-bar-wrap { min-width: 160px; }
  .stock-bar-meta {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    margin-bottom: 4px;
    font-weight: 600;
  }
